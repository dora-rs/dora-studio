[workspace]
resolver = "2"
members = [
    "dora-studio-shell",
    "dora-studio-widgets",
    "dora-studio-client",
    "apps/*",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/mofa-org/dora-studio"

[workspace.dependencies]
# UI Framework
makepad-widgets = { git = "https://github.com/makepad/makepad", branch = "dev" }
makepad-flow = { git = "https://github.com/swar09/makepad-flow" , branch = "dev"}
makepad-charts = { git = "https://github.com/mofa-org/makepad-chart" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# WASM support
wasm-bindgen-futures = "0.4"

# Workspace crate cross-references
dora-studio-client = { path = "dora-studio-client" }
dora-studio-widgets = { path = "dora-studio-widgets" }
dataflow-manager = { path = "apps/dataflow-manager" }
telemetry-dashboard = { path = "apps/telemetry-dashboard" }